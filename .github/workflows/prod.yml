name: "Prod Environment"

on:
  push:
    branches:
      - main

env:
  TF_WORKING_DIR: environments/prod
  CONFTEST_VERSION: "0.50.0"

jobs:
  # ── Manual Approval Gate ───────────────────────────────────
  # Pipeline pauses here until you approve in GitHub Actions
  # ──────────────────────────────────────────────────────────
  approval-gate:
    name: "Awaiting Prod Approval"
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Approval Received
        run: echo "Approval granted. Proceeding to production deployment..."

  # ── Prod Deploy (runs only after approval) ─────────────────
  terraform:
    name: Terraform Prod
    runs-on: ubuntu-latest
    needs: approval-gate
    environment: prod
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Install Conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v${{ env.CONFTEST_VERSION }}/conftest_${{ env.CONFTEST_VERSION }}_Linux_x86_64.tar.gz
          tar xzf conftest_${{ env.CONFTEST_VERSION }}_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      # ── OPA/Conftest Policy Check ──────────────────────────
      # Blocks the pipeline if any policy fails — apply never runs
      # ──────────────────────────────────────────────────────
      - name: Convert Plan to JSON
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -json tfplan > tfplan.json

      - name: Run OPA/Conftest Policy Checks
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          conftest test tfplan.json \
            --policy ../../policies/opa \
            --all-namespaces

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
