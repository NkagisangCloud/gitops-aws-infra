name: "Staging & Prod - CI/CD"

on:
  push:
    branches:
      - main

env:
  TF_VERSION: "1.7.0"
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Deploy to Staging (auto on merge to main)
  # ─────────────────────────────────────────────
  terraform-staging:
    name: "Terraform Staging Deploy"
    runs-on: ubuntu-latest
    environment: staging

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (Staging Backend)
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Select Staging Workspace
        run: |
          terraform workspace select staging || terraform workspace new staging

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan (Staging)
        run: |
          terraform plan \
            -var-file="environments/staging.tfvars" \
            -out=tfplan-staging \
            -no-color \
            -input=false
        env:
          TF_VAR_environment: staging

      - name: Terraform Apply (Staging)
        run: |
          terraform apply \
            -var-file="environments/staging.tfvars" \
            -auto-approve \
            -input=false
        env:
          TF_VAR_environment: staging

  # ─────────────────────────────────────────────
  # JOB 2: Manual Approval Gate
  # GitHub PAUSES here and waits for a required reviewer to approve
  # ─────────────────────────────────────────────
  approval-gate:
    name: "Awaiting Prod Approval"
    runs-on: ubuntu-latest
    needs: terraform-staging
    environment: prod        # <-- This triggers the approval gate
                             #     GitHub pauses until a required reviewer approves

    steps:
      - name: Approval Received
        run: echo "Approval granted. Proceeding to production deployment..."

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to Prod (only after approval)
  # ─────────────────────────────────────────────
  terraform-prod:
    name: "Terraform Prod Deploy"
    runs-on: ubuntu-latest
    needs: approval-gate     # Only runs after approval is granted
    environment: prod

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (Prod Backend)
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Select Prod Workspace
        run: |
          terraform workspace select prod || terraform workspace new prod

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan (Prod)
        run: |
          terraform plan \
            -var-file="environments/prod.tfvars" \
            -out=tfplan-prod \
            -no-color \
            -input=false
        env:
          TF_VAR_environment: prod

      - name: Terraform Apply (Prod)
        run: |
          terraform apply \
            -var-file="environments/prod.tfvars" \
            -auto-approve \
            -input=false
        env:
          TF_VAR_environment: prod
